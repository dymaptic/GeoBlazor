# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Main Branch Release Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Every push to main used to publish to NuGet. Dependabot security updates always target the
  # default branch, so merging them shipped unplanned versions (4.7.1). Only a release PR
  # (head branch develop or release/*) or a manual run may publish.
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      pr-number: ${{ steps.check.outputs.pr-number }}
    steps:
    - name: Check for a release PR
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "should-release=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
          --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0] // empty')
        HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref // empty')
        echo "pr-number=$(echo "$PR_JSON" | jq -r '.number // empty')" >> $GITHUB_OUTPUT
        if [ "$HEAD_REF" = "develop" ] || [[ "$HEAD_REF" == release/* ]]; then
          echo "should-release=true" >> $GITHUB_OUTPUT
        else
          echo "Skipping release: push to main came from '${HEAD_REF:-no PR}', not develop or release/*."
          echo "should-release=false" >> $GITHUB_OUTPUT
        fi

  build:
    needs: release-gate
    if: needs.release-gate.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Generate Github App token
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ secrets.SUBMODULE_APP_ID }}
        private-key: ${{ secrets.SUBMODULE_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: 'GeoBlazor'
    
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ steps.app-token.outputs.token }}
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
          
    - name: Update NPM
      uses: actions/setup-node@v4
      with:
        node-version: '>=22.11.0'
        check-latest: 'true'

    - name: Clean node_modules
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force ./pro/src/dymaptic.GeoBlazor.Pro/node_modules -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./src/dymaptic.GeoBlazor.Core/node_modules -ErrorAction SilentlyContinue

    - name: Update NPM
      uses: actions/setup-node@v4
      with:
        node-version: '>=22.11.0'
        check-latest: 'true'
      
      # This runs the main GeoBlazor build script for Core and Pro
    - name: Build GeoBlazor
      shell: pwsh
      run: |
        dotnet ./build-tools/win-x64/GeoBlazorBuild.dll -pro -xml -pkg -pub -c "Release"
      
      # xmllint is a dependency of the copy steps below
    - name: Install xmllint
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y libxml2-utils
    
      # This step will copy the version number from the Directory.Build.props file to an environment variable
    - name: Copy Build Version
      run: |
        CORE_VERSION=$(xmllint --xpath "//PropertyGroup/CoreVersion/text()" ./Directory.Build.props)
        echo "CORE_VERSION=$CORE_VERSION" >> $GITHUB_ENV
        
      # Copies the nuget packages to the artifacts directory
    - name: Upload nuget artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: .core-nuget
        path: ./dymaptic.GeoBlazor.Core.*.nupkg

    - name: Upload Pro nuget artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: .pro-nuget
        path: ./dymaptic.GeoBlazor.Pro.*.nupkg

      # This step will copy the release PR's description to an environment variable. It reads the PR
      # merged by this push, not the most recently closed PR, which could be any unrelated PR.
    - name: Copy PR Release Notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ needs.release-gate.outputs.pr-number }}
      run: |
        PR_DESCRIPTION=""
        if [ -n "$PR_NUMBER" ]; then
          PR_DESCRIPTION=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.body // ""')
        fi
        DESC_PLUS_EOF="${PR_DESCRIPTION}"
        echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
        echo "$DESC_PLUS_EOF" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    

      # Creates a GitHub Release based on the Version and the PR description
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body: ${{env.PR_DESCRIPTION}}
        tag_name: "v${{env.CORE_VERSION}}"
        generate_release_notes: true
        prerelease: false
        files: |
          ./src/dymaptic.GeoBlazor.Core/bin/Release/dymaptic.GeoBlazor.Core.*.nupkg
          ./pro/src/dymaptic.GeoBlazor.Pro/bin/Release/dymaptic.GeoBlazor.Pro.*.nupkg

  # This step will publish the Core and Pro NuGet packages to NuGet.org
  nuget-push:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download Core artifact from build job
      uses: actions/download-artifact@v4.1.8
      with:
        name: .core-nuget
    - name: Download Pro artifact from build job
      uses: actions/download-artifact@v4.1.8
      with:
        name: .pro-nuget
    - name: Publish Core to Nuget
      run: dotnet nuget push ./dymaptic.GeoBlazor.Core.*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
      # Pro depends on the matching Core version, so it is published after Core
    - name: Publish Pro to Nuget
      run: dotnet nuget push ./dymaptic.GeoBlazor.Pro.*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
